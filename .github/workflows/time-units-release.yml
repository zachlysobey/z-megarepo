name: time-units-release

on:
  push:
    branches: [ master ]
    paths: [ time-units/package.json, .github/workflows/time-units-release.yml ]

concurrency:
  group: time-units-release

jobs:
  release:
    name: Publish time-units to npm
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    env:
      CI: true

    defaults:
      run:
        working-directory: time-units

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'time-units/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'time-units/package-lock.json'

      - name: Check whether this version is already published
        id: check
        run: |
          name=$(npm pkg get name | tr -d '"')
          version=$(npm pkg get version | tr -d '"')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to release"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.published != 'true'
        run: npm ci

      - name: Run typecheck
        if: steps.check.outputs.published != 'true'
        run: npm run typecheck

      - name: Run tests
        if: steps.check.outputs.published != 'true'
        run: npm test

      - name: Publish
        if: steps.check.outputs.published != 'true'
        run: npm publish

      - name: Tag the release
        if: steps.check.outputs.published != 'true'
        env:
          TAG: time-units-v${{ steps.check.outputs.version }}
        run: git tag "$TAG" && git push origin "$TAG"
