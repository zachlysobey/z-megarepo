name: functional-release

on:
  push:
    branches: [ master ]
    paths: [ functional/** ]

concurrency:
  group: functional-release

jobs:
  release:
    name: Release functional to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: read

    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Release
        uses: ./.github/actions/release-package
        with:
          package: functional
