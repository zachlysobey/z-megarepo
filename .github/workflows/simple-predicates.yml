name: simple-predicates

on:
  push:
    branches: [ "**" ]
    paths: [ simple-predicates/**, .github/workflows/simple-predicates.yml ]
  pull_request:
    branches: [ "master" ]
    paths: [ simple-predicates/**, .github/workflows/simple-predicates.yml ]

jobs:
  simple-predicates:
    name: Run simple-predicates Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      CI: true

    defaults:
      run:
        working-directory: simple-predicates

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'simple-predicates/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'simple-predicates/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
