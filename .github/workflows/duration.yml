name: duration

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  duration:
    name: Run duration Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      CI: true

    defaults:
      run:
        working-directory: duration

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'duration/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'duration/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
